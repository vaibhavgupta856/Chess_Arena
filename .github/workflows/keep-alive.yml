# Ping the Render free-tier API so it does not sleep
# (Render spins down after ~15 minutes with no inbound traffic).
#
# Optional repo variable: RENDER_HEALTH_URL
#   e.g. https://chess-arena-backend-vaibhav.onrender.com/health
#
# The Go server also self-pings every 10 minutes once awake.
# GitHub cron can be delayed, so this runs every 5 minutes as a backup wake.

name: Keep API awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-api-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Render service
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          set -e
          URL="${HEALTH_URL:-https://chess-arena-backend-vaibhav.onrender.com/health}"
          echo "Pinging $URL"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 100 "$URL"; then
              echo
              echo "OK (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying..."
            sleep 12
          done
          echo "Health check failed"
          exit 1
